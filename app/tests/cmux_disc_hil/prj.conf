CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

# UART connected to the nRF91 Serial Modem
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Zephyr modem subsystem acting as the CMUX host
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_PIPE=y
CONFIG_MODEM_BACKEND_UART=y
CONFIG_MODEM_BACKEND_UART_ISR_RECEIVE_IDLE_TIMEOUT_MS=1
CONFIG_MODEM_CMUX=y
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=4256

# Logging; CMUX debug logs show every received frame, including CLD responses.
# Deferred mode keeps logging out of the CMUX work items being timed.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y
CONFIG_MODEM_CMUX_LOG_FRAMES=y

CONFIG_TEST_CMUX_CFUN_RETRY_DELAY_MS=100
