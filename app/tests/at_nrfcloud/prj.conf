CONFIG_UNITY=y
CONFIG_ASSERT=n

CONFIG_ASAN=y

CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y

CONFIG_RING_BUFFER=y
CONFIG_REBOOT=y
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_AT_PARSER=y

# Observability AT commands (AT#XNRFCLOUDOBS*).
CONFIG_SM_NRF_CLOUD_OBSERVABILITY=y
CONFIG_SM_NRF_CLOUD_OBSERVABILITY_DEBUG=y
CONFIG_SM_NRF_CLOUD_OBSERVABILITY_AUTO_INTERVAL_SECONDS=3600

# Required by the observability AT commands to decode a forwarded chunk.
CONFIG_BASE64=y

# AT#XNRFCLOUDOBSAUTO stores its configuration in settings. There is no storage back-end
# here, so settings_save_one() fails and the tests drive the load path by calling the
# settings handler of the module directly.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y

# Increase AT monitor heap because %NCELLMEAS notifications can be large
CONFIG_AT_MONITOR=y
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n

# Native sim settings
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n

