CONFIG_UNITY=y
CONFIG_ASSERT=n

CONFIG_ASAN=y

CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y

CONFIG_AT_PARSER=y
CONFIG_AT_MONITOR=y
CONFIG_AT_MONITOR_HEAP_SIZE=1024

CONFIG_RING_BUFFER=y
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_TEST_RANDOM_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n

# Native sim settings
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n

# SM core and PPP/CMUX settings (see Kconfig)
CONFIG_SM_LOG_LEVEL=0
CONFIG_SM_PPP=y
CONFIG_SM_PPP_FALLBACK_MTU=1500
CONFIG_SM_CMUX=y
CONFIG_SM_CMUX_CHANNEL_COUNT=3
