CONFIG_TFM_PROFILE_TYPE_NOT_SET=y

CONFIG_TFM_PARTITION_PLATFORM=y
CONFIG_TFM_PARTITION_CRYPTO=y
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
CONFIG_TFM_PARTITION_INITIAL_ATTESTATION=n
# Max asset size for PS. Default is 2048; certificate chains up to ~3.7 kB
# require at least 3800. Setting to the hardware maximum (4024).
# This also automatically raises TFM_CRYPTO_IOVEC_BUFFER_SIZE to 8192,
# which is needed to transfer larger credentials through the TF-M IPC boundary.
CONFIG_TFM_PS_MAX_ASSET_SIZE=4024

# Disable IPC to save RAM
CONFIG_TFM_IPC=n
CONFIG_TFM_SFN=y


CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y
CONFIG_SM_APP_TLS=y

# Dispatch TLS sockets to MbedTLS; underlying TCP socket remains modem-offloaded
CONFIG_NET_SOCKETS_OFFLOAD_DISPATCHER=y

# PSA crypto
CONFIG_PSA_CRYPTO=y

# TLS sockets
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_TLS_SET_MAX_FRAGMENT_LENGTH=y
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000
CONFIG_ZVFS_OPEN_MAX=10
CONFIG_NET_IPV4=y

# DTLS
CONFIG_MBEDTLS_SSL_PROTO_DTLS=y
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=y

# MbedTLS core
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# 32 KB fits one handshake at a time (sequential AT command flow).
# 48 KB needed if two contexts can handshake simultaneously.
# 64 KB (original) for maximum safety with 8 KB cert chains on both contexts.
CONFIG_MBEDTLS_HEAP_SIZE=49152
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SSL_SRV_C=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=8192
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_HMAC_DRBG_C=y

# System heap for k_malloc() used by PS backend to load credentials into RAM
# Peak = TLS_MAX_CREDENTIALS_NUMBER slots * ~2 kB each + allocator overhead
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=3
CONFIG_HEAP_MEM_POOL_SIZE=8192

# AES
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CBC_PKCS7=y

# ECC
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# ECDSA (required for ECDHE-ECDSA cipher suites and verifying EC server certificates)
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
CONFIG_PSA_WANT_ALG_HMAC=y

# ECDH (required for ECDHE key exchange in all ECDHE cipher suites)
CONFIG_PSA_WANT_ALG_ECDH=y

# ECDHE key exchange (TLS ciphersuite level, still current symbols)
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y

# RSA
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_CRYPT=y
CONFIG_MBEDTLS_MPI_MAX_SIZE=512
CONFIG_PSA_WANT_RSA_KEY_SIZE_2048=y
CONFIG_PSA_WANT_RSA_KEY_SIZE_4096=y

# SHA
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_512=y

# PSK
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y

# Disable unneeded modules
CONFIG_MBEDTLS_CTR_DRBG_C=n

# Disable SM functionality to free flash
CONFIG_SM_GNSS=n
CONFIG_SM_SMS=n
CONFIG_SM_MQTTC=n
CONFIG_NRF_CLOUD=n
CONFIG_NRF_CLOUD_COAP=n
CONFIG_NRF_CLOUD_AGNSS=n
CONFIG_MODEM_CMUX=n
