#
# Memfault: adds a flash-backed coredump on top of the default
# build (see prj.conf). Apply together with nrfcloud-coredump-flash.overlay,
# which carves the coredump flash partition by shrinking
# the MCUboot application slots by 8 KiB each. Use only where the flash budget allows (it
# reserves a 16 KiB coredump partition).
#

# Store the coredump in the dedicated memfault_coredump_partition (16 KiB) defined
# in nrfcloud-coredump-flash.overlay.
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=y
CONFIG_MEMFAULT_COREDUMP_STACK_SIZE_TO_COLLECT=1024
