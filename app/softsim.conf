# Serial Modem settings for the Onomondo SoftSIM.
# Use after the SoftSIM module's overlay-softsim.conf, together with softsim-nrf9151.overlay
# and softsim-sram-nrf9151.overlay.
CONFIG_SM_SOFTSIM=y

# SoftSIM does not allow the NVS settings backend
CONFIG_SETTINGS_NVS=n
CONFIG_FCB=y
CONFIG_SETTINGS_FCB=y

# softsim-nrf9151.overlay has no TF-M Protected Storage partition
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n

# Fit TF-M in the secure partition in softsim-nrf9151.overlay
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
