# Workflow that attaches additional assets to github release.
name: Attach Release Assets

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for and attach assets to'
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      trigger_source: 'release-workflow'
      release_tag: ${{ inputs.tag }}

  attach-assets:
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Deploy release to github
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
              artifact/*
