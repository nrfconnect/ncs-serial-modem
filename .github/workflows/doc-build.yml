name: Documentation Build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - '.github/workflows/doc-build.yml'
      - '.github/workflows/doc-publish.yml'
      - '**.rst'
      - 'doc/**'
      - "include/**"
  push:
    branches:
      - main
      - 'v*-branch'
    tags:
      - v*

env:
  DOXYGEN_VERSION: 1.12.0
  # The nRF91M1 docset is documented by its own release branch and published
  # under its own version, apart from the rest of the documentation. The two
  # values belong together, so they are declared together.
  NRF91M1_BRANCH: v2-branch
  NRF91M1_VERSION: 2.0.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install system dependencies
        run: |
          wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          sudo tar xf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz -C /opt
          echo "/opt/doxygen-${DOXYGEN_VERSION}/bin" >> $GITHUB_PATH

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full
          sudo apt-get install -y inkscape
          sudo apt-get install -y fonts-open-sans

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: doc/requirements.txt
          pip-install: |
            -r doc/requirements.txt

      - name: Check version and docset
        run: |
          # An update to the nRF91M1 release branch documents the nRF91M1
          # docset and publishes it under NRF91M1_VERSION. Everything else
          # documents the main docset: main as "latest" and a tag as its own
          # version. A pull request documents the docset of the branch it
          # targets, so that its preview shows what that branch would publish.
          VERSION_REGEX="^v([0-9a-zA-Z\.\-]+)$"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          if [[ "${BRANCH}" == "${NRF91M1_BRANCH}" ]]; then
            DOCSET="nrf91m1"
          else
            DOCSET="main"
          fi

          # The pull request case comes first: BRANCH is then the target of the
          # request, which would otherwise be taken for a build of that branch.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.number }}"
          elif [[ ${GITHUB_REF#refs/tags/} =~ $VERSION_REGEX ]]; then
            VERSION=${BASH_REMATCH[1]}
          elif [[ "${BRANCH}" == "main" ]]; then
            VERSION="latest"
          elif [[ "${BRANCH}" == "${NRF91M1_BRANCH}" ]]; then
            VERSION="${NRF91M1_VERSION}"
          fi

          echo "VERSION=${VERSION} DOCSET=${DOCSET}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DOCSET=${DOCSET}" >> "$GITHUB_ENV"

      - name: Build
        working-directory: doc
        run: |
          doxygen
          python _scripts/build_docsets.py -b build --format html --format pdf --docset "${DOCSET}"

      - name: Prepare Azure upload
        run: |
          PUBLISH="$PWD/publish"
          mkdir -p "$PUBLISH"

          MONITOR="monitor_${{ github.run_id }}.txt"

          # Create documentation upload files
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ARCHIVE="legacy-addon-serial_modem-pr-${{ github.event.number }}.zip"
            echo "publish2 dev PR-${{ github.event.number }} ${ARCHIVE}" > "${MONITOR}"
            echo "${{ github.event.number }}" > pr.txt
          else
            ARCHIVE="legacy-addon-serial_modem-${VERSION}.zip"
            echo "publish2 main ${VERSION} ${ARCHIVE}" > "${MONITOR}"
          fi

          # The build copied the PDF of every docset into its HTML directory,
          # so the archive ships them alongside the pages that link to them.
          pushd "doc/build/html"
          zip -rq "${ARCHIVE}" .
          mv "${ARCHIVE}" "$PUBLISH"
          popd

          mv "${MONITOR}" "$PUBLISH"
          if [[ -f pr.txt ]]; then mv pr.txt "$PUBLISH"; fi

      - name: Store
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'external') || contains(github.event.pull_request.labels.*.name, 'CI-trusted-author') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docs
          retention-days: 5
          path: |
            publish/*

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-pdf
          retention-days: 5
          # One PDF per docset, kept apart by the docset directory in the path.
          # Each one is named after its docset, in docsets.PDF_FILENAMES.
          path: doc/build/pdf/*/latex/*.pdf
