name: Documentation Build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - '.github/workflows/doc-build.yml'
      - '.github/workflows/doc-publish.yml'
      - '**.rst'
      - 'doc/**'
      - "include/**"
  push:
    branches:
      - main
      - 'v*-branch'
    tags:
      - v*

env:
  DOXYGEN_VERSION: 1.12.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install system dependencies
        run: |
          wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          sudo tar xf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz -C /opt
          echo "/opt/doxygen-${DOXYGEN_VERSION}/bin" >> $GITHUB_PATH

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full
          sudo apt-get install -y inkscape
          sudo apt-get install -y fonts-open-sans

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: doc/requirements.txt
          pip-install: |
            -r doc/requirements.txt

      - name: Check version
        run: |
          VERSION_REGEX="^v([0-9a-zA-Z\.\-]+)$"
          if [[ ${GITHUB_REF#refs/tags/} =~ $VERSION_REGEX ]]; then
            VERSION=${BASH_REMATCH[1]}
          elif [[ ${GITHUB_REF#refs/heads/} == "main" ]]; then
            VERSION="latest"
          elif [[ ${GITHUB_REF#refs/heads/} == "v2-branch" ]]; then
            # drop the 'v' so that versions.json doesn't need to list it
            VERSION="2-branch"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.number }}"
          fi
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [[ -f doc/nrf91m1/DOC_VERSION ]]; then
            NRF91M1_DOC_VERSION=$(tr -d '[:space:]' < doc/nrf91m1/DOC_VERSION)
          fi
          if [[ -n "${NRF91M1_DOC_VERSION:-}" ]]; then
            echo "NRF91M1_DOC_VERSION=${NRF91M1_DOC_VERSION}"
            echo "NRF91M1_DOC_VERSION=${NRF91M1_DOC_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: doc
        run: |
          doxygen
          python _scripts/build_docsets.py -b build --format html --format pdf -W --keep-going

      - name: Prepare Azure upload
        run: |
          PUBLISH="$PWD/publish"
          mkdir -p "$PUBLISH"

          # The branch the build belongs to, which is the base branch of a
          # pull request and the tag name of a tag build.
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "${{ github.event.number }}" > "$PUBLISH/pr.txt"
            CHANNEL=dev
            OUTDIR="PR-${{ github.event.number }}"
          else
            CHANNEL=main
            OUTDIR="${VERSION}"
          fi

          # One archive and one monitor file per publication, each uploaded to
          # an add-on directory of its own. Which publications this build
          # publishes, the directory of the add-on each goes into, and the
          # directory each is archived from all follow from PUBLICATIONS in
          # doc/_utils/docsets.py. Every branch builds every publication, which
          # keeps the sources validated, but a publication can be limited to
          # the branch it is published from and the tags of its releases.
          SPECS=$(python - "$OUTDIR" "$BRANCH" <<'EOF'
          import sys
          from pathlib import Path

          sys.path.insert(0, "doc/_utils")
          import docsets

          version, branch = sys.argv[1:]

          for publication in docsets.PUBLICATIONS:
              outdir = docsets.publish_version(publication, version, branch)
              if outdir is None:
                  print(f"Not publishing {publication} from {branch}", file=sys.stderr)
                  continue
              print(publication, outdir, docsets.publish_dir(Path("doc/build"), publication))
          EOF
          )

          while read -r PUBLICATION OUTDIR SOURCE; do
            # An empty SPECS still feeds the loop one empty line.
            [ -n "$PUBLICATION" ] || continue

            # doc-publish.yml reads the add-on directory back out of the
            # archive name, so the name carries the publication, and unpacks
            # the archive into the directory of the third field.
            MONITOR="monitor_${{ github.run_id }}_${PUBLICATION}.txt"
            ARCHIVE="legacy-addon-${PUBLICATION}-${OUTDIR,,}.zip"
            echo "publish2 ${CHANNEL} ${OUTDIR} ${ARCHIVE}" > "${MONITOR}"

            # The build copied the PDF of every docset into its HTML directory,
            # so the archive ships them alongside the pages that link to them.
            pushd "${SOURCE}"
            zip -rq "${ARCHIVE}" .
            mv "${ARCHIVE}" "$PUBLISH"
            popd

            mv "${MONITOR}" "$PUBLISH"
          done <<< "$SPECS"

      - name: Store
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'external') || contains(github.event.pull_request.labels.*.name, 'CI-trusted-author') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docs
          retention-days: 5
          path: |
            publish/*

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-pdf
          retention-days: 5
          # One PDF per docset, kept apart by the publication and docset
          # directories in the path.
          path: doc/build/pdf/*/*/latex/*.pdf
