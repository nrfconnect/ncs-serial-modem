name: Documentation Remove

permissions:
  contents: read

on:
  pull_request_target:
    types: [closed]
    branches:
      - main
      - 'v*-branch'

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Try removal of PR-docs
        env:
          AZCOPY_CONCURRENCY_VALUE: 3000
        run: |
          # One preview per publication, under the add-on directory that
          # .github/workflows/doc-publish.yml uploaded it to. A publication
          # that the pull request did not build has no preview to remove, which
          # azcopy reports as an error that is ignored here.
          for ADDON in addon-serial_modem addon-nrf91m1; do
            azcopy rm "${{ vars.NCS_DOC_PR_STORAGE_URL }}addons/${ADDON}/PR-${{ github.event.number }}?${{ secrets.NCS_DOC_SAS_PRS }}" --recursive=true || true
          done
