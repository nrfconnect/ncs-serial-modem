manifest:
  # Optional projects. Enable with: west config manifest.group-filter -- +nusim
  group-filter: [-nusim]

  self:
    import: submanifests

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.4.1
      import:
        name-allowlist:
          - cjson
          - cmsis_6
          - cmock
          - hal_nordic
          - libmodem
          - mbedtls
          - mcuboot
          - nrfxlib
          - oberon-psa-crypto
          - segger
          - tf-psa-crypto
          - trusted-firmware-m
          - zcbor
          - zephyr
          - littlefs

    - name: memfault-firmware-sdk
      url: https://github.com/memfault/memfault-firmware-sdk
      path: modules/lib/memfault-firmware-sdk
      revision: 1.45.0

    - name: redteamobile-nusim
      url: https://github.com/redteamobile/ncs-nusim-app.git
      path: modules/lib/redteamobile-nusim
      revision: main
      groups:
        - nusim
